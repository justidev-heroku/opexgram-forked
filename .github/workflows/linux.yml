name: Linux.

on:
  workflow_dispatch:
  push:
    # StaticGram: build the Linux AppImage only from our branch.
    branches:
      - staticgram-desktop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
      - '.github/**'
      - '!.github/workflows/linux.yml'
      - 'snap/**'
      - 'Telegram/build/**'
      - '!Telegram/build/docker/centos_env/**'
      - 'Telegram/Resources/uwp/**'
      - 'Telegram/Resources/winrc/**'
      - 'Telegram/SourceFiles/platform/win/**'
      - 'Telegram/SourceFiles/platform/mac/**'
      - 'Telegram/Telegram/**'
      - 'Telegram/configure.bat'
      - 'Telegram/Telegram.plist'

jobs:

  linux:
    name: Rocky Linux 8 (x86_64 AppImage)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      matrix:
        defines:
          - ""

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: ${{ env.ONLY_CACHE == 'false' }}
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Restore Telegram Desktop cache.
        id: cache-tdesktop
        if: env.ONLY_CACHE == 'false'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-${{ matrix.defines || 'null' }}-

      - name: Telegram Desktop build.
        if: env.ONLY_CACHE == 'false'
        run: |
          DEFINE=""
          if [ -n "${{ matrix.defines }}" ]; then
            DEFINE="-D ${{ matrix.defines }}=ON"
            echo Define from matrix: $DEFINE
          fi
          echo "ARTIFACT_NAME=StaticGram-Linux-x64" >> $GITHUB_ENV

          ccache -z

          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D CMAKE_BUILD_TYPE=Release \
          -D TDESKTOP_API_TEST=ON \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON \
          $DEFINE

      - name: Count ccache misses.
        id: ccache-stats
        if: env.ONLY_CACHE == 'false'
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Check.
        if: env.ONLY_CACHE == 'false'
        run: |
          filePath="out/Release/Telegram"
          if test -f "$filePath"; then
            echo "Build successfully done! :)"
            size=$(stat -c %s "$filePath")
            echo "File size of ${filePath}: ${size} Bytes."
            ldd "$filePath" || true
          else
            echo "Build error, output file does not exist."
            exit 1
          fi

      - name: Package AppImage.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          set -e
          mkdir -p dist
          cp out/Release/Telegram dist/StaticGram
          strip dist/StaticGram || true
          chmod 755 dist/StaticGram

          # Plain tarball with the binary.
          mkdir -p tarball/StaticGram
          cp dist/StaticGram tarball/StaticGram/
          tar -C tarball -czf dist/StaticGram-Linux-x64.tar.gz StaticGram

          # AppDir: the binary is self-contained (static Qt, glibc 2.28),
          # system libraries are picked up at runtime like the official build.
          APPDIR=$PWD/StaticGram.AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/applications
          cp dist/StaticGram $APPDIR/usr/bin/StaticGram
          for s in 16 32 48 64 128 256 512; do
            d=$APPDIR/usr/share/icons/hicolor/${s}x${s}/apps
            mkdir -p $d
            cp Telegram/Resources/art/icon${s}.png $d/StaticGram.png
          done
          cp Telegram/Resources/art/icon256.png $APPDIR/StaticGram.png
          ln -sf StaticGram.png $APPDIR/.DirIcon
          cat > $APPDIR/usr/share/applications/StaticGram.desktop <<'EOF'
          [Desktop Entry]
          Name=StaticGram
          Comment=StaticGram messenger
          Exec=StaticGram -- %u
          Icon=StaticGram
          Terminal=false
          StartupWMClass=StaticGram
          Type=Application
          Categories=Chat;Network;InstantMessaging;Qt;
          MimeType=x-scheme-handler/sg;
          Keywords=tg;chat;im;messaging;messenger;staticgram;
          SingleMainWindow=true
          X-GNOME-UsesNotifications=true
          EOF
          cp $APPDIR/usr/share/applications/StaticGram.desktop $APPDIR/StaticGram.desktop
          cat > $APPDIR/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/StaticGram" "$@"
          EOF
          chmod 755 $APPDIR/AppRun

          curl -sSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool --no-appstream $APPDIR dist/StaticGram-x86_64.AppImage
          chmod 755 dist/StaticGram-x86_64.AppImage
          ls -la dist
          sha256sum dist/*

      - name: Smoke test.
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |
          cd dist
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen timeout 20 ./StaticGram-x86_64.AppImage --version || echo "exit $?"

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload AppImage.
        with:
          name: StaticGram-x86_64.AppImage
          path: dist/StaticGram-x86_64.AppImage
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: env.UPLOAD_ARTIFACT == 'true'
        name: Upload tarball.
        with:
          name: StaticGram-Linux-x64.tar.gz
          path: dist/StaticGram-Linux-x64.tar.gz
          retention-days: 7
